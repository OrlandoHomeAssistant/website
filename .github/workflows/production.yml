name: Release production
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (run this workflow from that same tag)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-production
  cancel-in-progress: false
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  release:
    name: Verify release provenance
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.policy.outputs.sha }}
      tag: ${{ steps.policy.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Require a published stable tag pointing to reviewed main history
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/release-policy.mjs
  validate:
    name: Release Node ${{ matrix.node }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run assets && git diff --exit-code -- dist/
      - run: npx wrangler deploy --config wrangler.production.jsonc --dry-run
  deploy:
    name: Deploy approved production release
    needs: [release, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://orlando-home-assistant.thestealthsmarthome.workers.dev
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify production credentials and access to the existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami --json > "$RUNNER_TEMP/cloudflare-auth.json"
          node --input-type=module <<'JS'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!/^[a-f0-9]{32}$/.test(account || '') || !process.env.CLOUDFLARE_API_TOKEN)throw new Error('Missing production credentials');
          const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/orlando-home-assistant/settings`,{headers:{Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`},signal:AbortSignal.timeout(15000)});
          if(!response.ok || !(await response.json()).success)throw new Error(`Production Worker access check failed (HTTP ${response.status})`);
          console.log('Production Worker access verified.');
          JS
      - name: Deploy the exact validated tag
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: npm run deploy:production -- --var "BUILD_SHA:$RELEASE_SHA"
      - name: Verify production revision and public endpoints
        env:
          EXPECTED_BUILD_SHA: ${{ needs.release.outputs.sha }}
        run: npm run smoke -- https://orlando-home-assistant.thestealthsmarthome.workers.dev
      - name: Record production release
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: printf 'Deployed %s (%s) to https://orlando-home-assistant.thestealthsmarthome.workers.dev\nDomain redirect remains unchanged.\n' "$RELEASE_TAG" "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
